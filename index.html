loadDS('components/',DS_FILES).then(NS=>{

function copyToClipboard(txt,done){const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done&&done()}catch(e){}document.body.removeChild(ta)};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>done&&done()).catch(fb)}else{fb()}}
function Hero(){
  return <section style={{padding:'120px 24px 60px',textAlign:'center',maxWidth:1020,margin:'0 auto'}}>
    <h1 style={{margin:0,fontSize:'clamp(36px,4.5vw,68px)',fontWeight:600,letterSpacing:'var(--tracking-display)',lineHeight:'var(--leading-tight)'}}>Connect your AI to all data<br/>in one entry point, in the form it needs.</h1>
    <p style={{margin:'26px auto 0',maxWidth:660,fontSize:16,lineHeight:1.4,color:'var(--text-muted)'}}>An open-source library that lets AI agents declare the finished result. mloda gets the data, cleans it, joins it, removes personal data, and hands back the result ready to use. Each step is a small piece of code, written once and reusable for all use cases.</p>
    <div style={{display:'flex',gap:12,justifyContent:'center',marginTop:34}}>
      <Button label="Talk to us" variant="ink" size="lg" href="https://calendly.com/hello-mloda/30min"/>
      <Button label="Free on GitHub" variant="primary" size="lg" href="https://github.com/mloda-ai/mloda"/>
    </div>
  </section>;
}
function Slideshow({interval=2200,bright}){
  const steps=[['1','The agent asks for the score'],['2','mloda gives back the scores'],['3','How each score was made']];
  const imgs=['mloda-screenshot-1-panel.png','mloda-screenshot-2-panel.png','mloda-screenshot-3-panel.png'];
  const [i,setI]=React.useState(0);
  const [hover,setHover]=React.useState(false);
  React.useEffect(()=>{if(!interval||hover)return;const t=setInterval(()=>setI(v=>(v+1)%imgs.length),interval);return ()=>clearInterval(t)},[interval,hover]);
  return <div onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} style={{display:'flex',gap:16,alignItems:'center'}}>
    <div style={{display:'flex',flexDirection:'column',gap:10,flexShrink:0}}>
      {steps.map(([n,l],k)=><button key={n} onMouseEnter={()=>setI(k)} onClick={()=>setI(k)}
        style={{display:'flex',alignItems:'center',gap:8,padding:'9px 14px',borderRadius:10,cursor:'pointer',
          border:k===i?'1.5px solid var(--accent)':(bright?'1.5px solid var(--line-light)':'1.5px solid rgba(255,255,255,.25)'),
          background:k===i?'var(--accent)':'transparent',color:k===i?'#fff':(bright?'var(--text-muted)':'rgba(255,255,255,.75)'),
          fontFamily:'var(--font-sans)',fontSize:13.5,fontWeight:600,transition:'all 250ms var(--ease-brand)'}}>
        <span style={{fontWeight:700,fontSize:15}}>{n}</span>{l}</button>)}
    </div>
    <div style={{position:'relative',flex:1,minWidth:0,aspectRatio:'880/740',borderRadius:16,border:'1px solid var(--line-light)',background:'#fff',overflow:'hidden'}}>
      {imgs.map((f,n)=><img key={f} src={A+'images/'+f} alt={'mloda step '+(n+1)}
        style={{position:'absolute',inset:0,width:'100%',height:'100%',objectFit:'contain',objectPosition:'left top',padding:'14px 10px',boxSizing:'border-box',
          opacity:n===i?1:0,transform:n===i?'translateX(0)':(n<i?'translateX(-24px)':'translateX(24px)'),
          transition:'opacity 400ms var(--ease-brand), transform 400ms var(--ease-brand)'}}/>)}
    </div>
  </div>;
}
function ProductPanel({interval,bright}){
  return <section id="lineage" style={{padding:'24px 24px 60px',maxWidth:1200,margin:'0 auto'}}>
    <div style={{background:bright?'var(--paper-1)':'var(--ink-900)',borderRadius:'var(--radius-panel)',border:bright?'1px solid var(--line-light)':'1px solid var(--line-dark)',padding:'48px 48px 38px',color:bright?'var(--text-ink)':'var(--text-on-dark)',boxShadow:bright?'0 24px 60px rgba(14,18,15,.08)':'var(--shadow-panel)',display:'grid',gridTemplateColumns:'1fr 1.9fr',gap:48,alignItems:'center'}}>
      <div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <h2 style={{margin:0,fontSize:'calc(var(--text-h2)*0.82)',fontWeight:600,letterSpacing:'var(--tracking-display)'}}><span style={{fontSize:'var(--text-h2)'}}>See it live:</span><br/>mloda-backed<br/>credit risk agent.</h2>
        </div>
        <p style={{margin:'20px 0 0',fontSize:17,lineHeight:'var(--leading-body)',color:bright?'var(--text-muted)':'var(--text-on-dark-2)'}}>The agent asks for the credit risk score. mloda gets the customer and contract data, does the calculations, and gives back a table of scores. For every score you can see which data it read and which steps ran.</p>
        <div style={{display:'flex',gap:12,marginTop:30,alignItems:'center'}}>

}
function DataSources({logoWall}){
  const srcs=[['Databases','Data lakes, warehouses, SQL stores - queried in place, no copies.'],['Tabular data','Dataframes, CSV, tables - native on Pandas, Polars, Spark.'],['Unstructured data','Text, Markdown, PDF, knowledge graphs. Prepared for RAG and for your AI to search.'],['Models & APIs','Third-party and internal services - wrapped once, reused everywhere.']];
  const names=[
    [['income','income'],['fill the gaps','mean_imputed'],['add up','sum_aggr']],
    [['spend','spend'],['fill the gaps','mean_imputed'],['add up','sum_aggr']],
    [['documents','docs'],['remove personal data','pii_redacted'],['make searchable','embedded']],
    [['emails','emails'],['remove personal data','pii_redacted'],['make searchable','embedded']]];
  const [tick,setTick]=React.useState(0);
  React.useEffect(()=>{const t=setInterval(()=>setTick(v=>v+1),4500);return ()=>clearInterval(t)},[]);
  const name=names[tick%names.length];
  const prev=names[(tick+names.length-1)%names.length];
  const fullName=name.map(([p,c],i)=>c).join('__');
  const [hov,setHov]=React.useState(null);
  const curve=i=>{const ys=[10,32,68,90];return `M 0 ${ys[i]} C 60 ${ys[i]}, 90 50, 160 50`};
  return <section id="how-it-works" style={{padding:'36px 24px 44px',maxWidth:1200,margin:'0 auto'}}>
    <SectionHeader title={<span>Why is every new AI question a new data project?</span>} lede="The data work becomes small steps you can put together in any order, swap when something changes, and reuse for every question after." align="center"/>
    <div style={{display:'grid',gridTemplateColumns:'minmax(220px,260px) minmax(560px,1fr)',gap:0,alignItems:'center',marginTop:20}}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {srcs.map(([h,p],i)=><div key={h} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}
          style={{position:'relative',background:'var(--paper-0)',border:hov===i?'1px solid var(--accent)':'1px solid var(--text-ink)',borderRadius:'var(--radius-card)',padding:'16px 20px',cursor:'default',transition:'all 250ms var(--ease-brand)',boxShadow:hov===i?'0 8px 24px rgba(14,18,15,.10)':'none'}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:600,color:hov===i?'var(--accent)':'var(--text-ink)',transition:'color 250ms var(--ease-brand)'}}>{h}</h3>
          <div style={{maxHeight:hov===i?60:0,opacity:hov===i?1:0,overflow:'hidden',transition:'all 300ms var(--ease-brand)'}}>
            <p style={{margin:'6px 0 0',fontSize:13.5,lineHeight:1.45,color:'var(--text-muted)'}}>{p}</p>
          </div>
        </div>)}
      </div>
      <div style={{position:'relative',alignSelf:'stretch',minHeight:340,minWidth:0,display:'flex',alignItems:'center',justifyContent:'flex-start',gap:14,padding:'0 8px'}}>
        <svg viewBox="0 0 560 100" preserveAspectRatio="none" style={{position:'absolute',inset:0,width:'100%',height:'100%',zIndex:0}}>
          {srcs.map((s,i)=><path key={i} d={curve(i)} fill="none" stroke={hov===i?'var(--accent)':'rgba(15,23,32,.24)'} strokeWidth={hov===i?1.6:1.2} strokeDasharray="4 5" style={{transition:'stroke 250ms'}} vectorEffect="non-scaling-stroke"/>)}
          <line x1="160" y1="50" x2="520" y2="50" stroke="rgba(15,23,32,.24)" strokeWidth="1.2" strokeDasharray="4 5" vectorEffect="non-scaling-stroke"/>
        </svg>
        <div style={{flex:'0 0 calc(28.5% - 64px)'}}/>
        <div style={{position:'relative',zIndex:1,background:'var(--accent)',color:'#fff',borderRadius:14,padding:'16px 30px',fontFamily:'Helvetica,Arial,sans-serif',fontWeight:600,fontSize:24}}>mloda</div>
        <div style={{position:'relative',zIndex:1,flexShrink:0,display:'flex',flexDirection:'column',alignItems:'stretch',gap:6,width:190,background:'var(--paper-0)',padding:'6px 0',marginLeft:60}}>
            {name.map(([plain,code],i)=>{const same=tick>0&&prev[i][1]===code;return <div key={i+':'+code} style={{position:'relative',borderRadius:8,padding:'6px 10px 5px',textAlign:'center',
              background:i===0?'var(--ink-900)':'var(--paper-0)',color:i===0?'#fff':'var(--text-ink)',border:i===0?'1px solid var(--ink-900)':'1px solid var(--accent)',
              animation:same?'none':'plugIn 380ms var(--ease-brand) both',animationDelay:(i*220)+'ms'}}>
              <div style={{fontSize:13,fontWeight:600,lineHeight:1.2}}>{plain}</div>
              <div style={{fontFamily:'var(--font-mono)',fontSize:10,color:i===0?'rgba(255,255,255,.7)':'var(--accent)',marginTop:2}}>{i===0?code:'__'+code}</div>
              {same&&<span key={tick} style={{position:'absolute',right:-8,top:-8,background:'var(--accent)',color:'#fff',borderRadius:999,padding:'2px 7px',fontSize:9.5,fontWeight:700,letterSpacing:'0.04em',animation:'plugIn 300ms var(--ease-brand) both'}}>reused</span>}
            </div>})}
            <div style={{borderRadius:8,padding:'6px 10px',fontFamily:'var(--font-mono)',fontSize:12,textAlign:'center',border:'1px dashed rgba(15,23,32,.4)',color:'var(--text-muted)'}}>+ your step</div>
          </div>
        <div style={{position:'relative',zIndex:1,marginLeft:60,border:'1.5px solid var(--accent)',background:'var(--paper-0)',borderRadius:14,padding:'12px 14px',fontSize:13,color:'var(--text-ink)',lineHeight:1.45,maxWidth:160}}>
          <div style={{fontFamily:'var(--font-mono)',fontWeight:700,marginBottom:4}}>The result</div>
          A table, text or documents, ready to use.
        </div>
      </div>
    </div>
    {logoWall&&<div style={{marginTop:0}}>{logoWall}</div>}
  </section>;
}
function PluginAnimOptions(){
  const [tick,setTick]=React.useState(0);
  React.useEffect(()=>{const t=setInterval(()=>setTick(v=>v+1),3000);return()=>clearInterval(t)},[]);
  const greens=['var(--accent)','#7BCB89','#12813C'];
  const swapIdx=tick%5;
  const Cap=({t})=><div style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'0.06em',textTransform:'uppercase',color:'var(--text-muted)',marginTop:8,textAlign:'center'}}>{t}</div>;
  return <div style={{maxWidth:880,margin:'56px auto 0',display:'flex',flexDirection:'column',alignItems:'center',gap:22}}>
    <p style={{margin:'0 0 6px',fontSize:'var(--text-body-size)',lineHeight:'var(--leading-body)',color:'var(--text-muted)',textAlign:'center'}}>Each step is a small piece of code, written once and reused in every request. Swap one step, the rest stays.</p>
    <div>
      <div key={'rb'+tick} style={{display:'flex',alignItems:'center',opacity:0.75}}>
        {[0,1,2,3,4].map(i=><div key={i} style={{width:46,height:26,background:'#DDE3DE',border:'1px solid #B9C2BA',marginLeft:i?-1:0,animation:'rebuildIn 420ms var(--ease-brand) both',animationDelay:(i*160)+'ms',transformOrigin:'left center'}}/>)}
        <div style={{width:22,height:22,borderRadius:'50%',background:'var(--ink-900)',color:'#fff',display:'grid',placeItems:'center',fontSize:12,lineHeight:1,marginLeft:12}}>✕</div>
      </div>
      <Cap t="one long script, rewritten for every new question"/>
    </div>
    <div>
      <div style={{display:'flex',gap:10,alignItems:'center'}}>
        {[0,1,2,3,4].map(i=><div key={i===swapIdx?'s'+tick:i} style={{width:60,height:40,borderRadius:11,background:i===swapIdx?greens[tick%3]:'var(--paper-0)',border:'1.5px solid var(--accent)',boxShadow:i===swapIdx?'0 8px 20px rgba(35,164,85,.35)':'0 2px 8px rgba(14,18,15,.06)',animation:i===swapIdx?'swapSpring 800ms var(--ease-brand) both':'none',transform:i===swapIdx?'scale(1.06)':'scale(1)'}}/>)}
        <div style={{width:26,height:26,borderRadius:'50%',background:'var(--accent)',color:'#fff',display:'grid',placeItems:'center',fontSize:14,marginLeft:4}}>✓</div>
      </div>
      <Cap t="mloda: swap one step, the rest stays"/>
    </div>
  </div>;
}
function Plugins(){
  const examples=[
    {name:['income','__sum_aggr'],plain:['Take income.','Add it up.']},
    {name:['customer_monthly_spend','__avg_30_day_window'],plain:['Take the monthly spend.','Average it over the last 30 days.']},
    {name:['docs','__pii_redacted','__chunked','__embedded'],plain:['Take the documents.','Remove personal data.','Cut them into pieces.','Make them searchable for your AI.']}
  ];
  const [tick,setTick]=React.useState(0);
  const [hover,setHover]=React.useState(false);
  React.useEffect(()=>{if(hover)return;const t=setInterval(()=>setTick(v=>v+1),7000);return ()=>clearInterval(t)},[hover]);
  let d=0;
  return <section id="steps" style={{padding:'36px 24px 64px',maxWidth:1200,margin:'0 auto'}}>
    <SectionHeader title={<span>One name, all the steps.</span>} lede="Add a word, add a step. Every word after the name is one step, and mloda runs them in order." align="center"/>
    <div key={tick} onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      style={{marginTop:32,display:'flex',flexDirection:'column',alignItems:'center',gap:22}}>
      {examples.map((ex,ri)=><div key={ri} style={{display:'flex',flexDirection:'column',alignItems:'center',gap:8}}>
        <div style={{display:'flex',alignItems:'center',flexWrap:'wrap',justifyContent:'center',gap:8}}>
          <div style={{background:'var(--ink-900)',color:'#fff',borderRadius:10,padding:'9px 15px',fontFamily:'var(--font-mono)',fontSize:14.5,fontWeight:500,lineHeight:'19px',animation:'plugIn 400ms var(--ease-brand) both',animationDelay:(d++*450)+'ms'}}>{ex.name[0]}</div>
          {ex.name.slice(1).map(s=><div key={s} style={{borderRadius:10,border:'1px solid var(--accent)',background:'var(--paper-0)',padding:'9px 14px',fontFamily:'var(--font-mono)',fontSize:14,color:'var(--accent)',whiteSpace:'nowrap',lineHeight:'19px',animation:'plugIn 400ms var(--ease-brand) both',animationDelay:(d++*450)+'ms'}}>{s}</div>)}
        </div>
        <div style={{fontSize:14,lineHeight:1.5,color:'var(--text-muted)',textAlign:'center',animation:'plugIn 400ms var(--ease-brand) both',animationDelay:(d*450)+'ms'}}>{ex.plain.join(' ')}</div>
      </div>)}
    </div>
    <p style={{margin:'30px auto 0',maxWidth:640,fontSize:14.5,lineHeight:1.5,color:'var(--text-muted)',textAlign:'center'}}>About 30 ready-made steps come with mloda: clean, join, add up, average, fill gaps, put on the same scale, score, remove personal data, cut into pieces, make searchable. Missing one? Write it once as a small piece of code, and every request can use it. Works the same on the tools you already use (Pandas, Polars, Spark, DuckDB).</p>

    <PluginAnimOptions/>
  </section>;
}
function UseCaseCard({repo,eyebrow,title,desc,art,style}){
  const url='https://github.com/mloda-ai/'+repo;
  const [copied,setCopied]=React.useState(false);
  const [shareHov,setShareHov]=React.useState(false);
  const share=()=>{const fb=()=>{const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');setCopied(true)}catch(e){}document.body.removeChild(ta)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>setCopied(true)).catch(fb)}else{fb()}
    setTimeout(()=>setCopied(false),2000)};
  return <div style={{display:'flex',flexDirection:'column',borderRadius:'var(--radius-panel)',overflow:'hidden',background:'var(--ink-900)',color:'var(--text-on-dark)',...style}}>
    <a href={url} target="_blank" style={{display:'block',height:150,background:'var(--ink-850)',borderBottom:'1px solid var(--line-dark)',cursor:'pointer'}}>{art}</a>
    <div style={{padding:'22px 26px 24px',display:'flex',flexDirection:'column',gap:10,flex:1}}>
      <div style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--text-on-dark-2)'}}>{eyebrow}</div>
      <h3 style={{margin:0,fontSize:21,fontWeight:600,lineHeight:1.25}}>{title}</h3>
      <p style={{margin:0,fontSize:14,lineHeight:1.55,color:'var(--text-on-dark-2)',flex:1}}>{desc}</p>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8}}>
        <a href={url} target="_blank" style={{fontSize:14,fontWeight:600,color:'#fff'}}>Access case →</a>
        <span onClick={share} onMouseEnter={()=>setShareHov(true)} onMouseLeave={()=>setShareHov(false)} style={{fontSize:13,color:shareHov?'var(--ink-900)':'#fff',background:shareHov?'#fff':'transparent',border:'1px solid rgba(255,255,255,.45)',borderRadius:999,padding:'6px 14px',cursor:'pointer',transition:'all 180ms var(--ease-brand)'}}>{copied?'Link copied!':'Share case'}</span>
      </div>
    </div>
  </div>;
}

            <text x={51+i*72} y="79" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="11" fill={i===4?'#fff':'var(--green-400)'}>{t}</text>
            {i<4&&<text x={80+i*72+7} y="79" fontFamily="var(--font-mono)" fontSize="11" fill="var(--sand-300)">__</text>}
          </g>)}
          <text x="195" y="128" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="10" fill="var(--text-on-dark-2)">clean · split · search · answer</text>
        </svg>}/>
      <UseCaseCard repo="mloda-plugin-govdata" eyebrow="govdata · Open government data" title="Steps for public data" desc="German open government data, ready for your AI. Ask for a dataset by name, get it back clean, and see where every value came from. Funded by the German Federal Ministry of Research via the Prototype Fund." style={{width:390,flexShrink:0}}
        art={<svg viewBox="0 0 390 150" style={{width:'100%',height:'100%'}}>
          <path d="M155 52 L195 30 L235 52 Z" fill="none" stroke="var(--green-400)" strokeWidth="2"/>
          {[0,1,2,3].map(i=><rect key={i} x={160+i*19} y="58" width="9" height="34" fill="none" stroke="var(--green-400)" strokeWidth="1.6"/>)}
          <rect x="150" y="96" width="90" height="7" fill="var(--accent)"/>
          {[[70,60],[70,86],[298,60],[298,86]].map(([x,y],i)=><g key={i}><rect x={x-28} y={y-9} width="56" height="18" rx="5" fill="none" stroke="var(--green-400)" strokeWidth="1.2" opacity=".6"/><line x1={x+(x<195?28:-28)} y1={y} x2={x<195?148:242} y2="75" stroke="var(--green-400)" strokeWidth="1.2" opacity=".45"/></g>)}
          <text x="195" y="133" textAnchor="middle" fontFamily="var(--font-mono)" fontSize="10" fill="var(--text-on-dark-2)">Prototype Fund · BMFTR · Apache-2.0</text>
        </svg>}/>
    </div>
  </section>;
}
function UseCases({bright}){

        <h3 style={{margin:0,fontSize:19,fontWeight:600}}>{h}</h3>

function Stories(){
  return <section style={{padding:'90px 24px',maxWidth:1200,margin:'0 auto'}}>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end'}}>
      <SectionHeader title="From the blog"/>
      <Button label="All posts" variant="ink" size="sm"/>
    </div>
    <div style={{display:'flex',gap:20,marginTop:44,flexWrap:'wrap'}}>
      <CaseStudyCard linkLabel="Read more" logoText="Docs" title="Declarative data access: why agents should say what, not how"/>
      <CaseStudyCard linkLabel="Read our case study" logoText="Case study" industry="Finance" title="How a risk team made every feature auditable with mloda"/>
      <CaseStudyCard linkLabel="Read post" logoText="Release" title="mloda 0.10: lineage API and new source connectors"/>
    </div>
  </section>;
}
function CopyPromptButton({label,prompt,popup,hint}){
  const [open,setOpen]=React.useState(false);
  const [copied,setCopied]=React.useState(false);
  const copy=()=>copyToClipboard(prompt,()=>setCopied(true));
  return <div onMouseEnter={()=>setOpen(true)} onMouseLeave={()=>{setOpen(false);setCopied(false)}} style={{position:'relative',display:'inline-block'}}>
    <Button label={label} variant="ink" size="sm" onClick={copy}/>
    <div style={{position:'absolute',left:'50%',bottom:'calc(100% + 10px)',transform:'translateX(-50%) '+(open?'translateY(0)':'translateY(6px)'),opacity:open?1:0,pointerEvents:'none',transition:'all 250ms var(--ease-brand)',background:'var(--paper-0)',border:'1px solid var(--line-light)',boxShadow:'0 12px 32px rgba(14,18,15,.14)',borderRadius:12,padding:'10px 12px',width:150,textAlign:'center',zIndex:5}}>
      <div style={{fontSize:13.5,fontWeight:600,color:'var(--accent)'}}>{copied?'Copied!':popup}</div>
      <div style={{fontFamily:'var(--font-mono)',fontSize:10.5,color:'var(--text-muted)',marginTop:4,lineHeight:1.45}}>{copied?'Paste it into your coding agent.':hint||'Click to copy a prompt for your coding agent.'}</div>
    </div>
  </div>;
}
function GetStarted(){
  const opts=[["Install it yourself","Copy one command. pip install mloda, then ask for your first result by name in minutes.","pip install","pip"],["Read the docs","Installation, the first steps, and the list of ready-made steps you can use today.","Open the docs",DOCS],["Let your coding agent do it","Copy one prompt. Your coding agent installs mloda and connects your data sources.","Copy the prompt","agent"]];
  return <section style={{padding:'48px 24px 68px',maxWidth:1200,margin:'0 auto'}}>
    <SectionHeader title="Get started" lede="Three ways in: install it, read the docs, or let your coding agent do it. Same library, from notebook to production." align="center"/>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:20,marginTop:52}}>
      {opts.map(([h,p,cta,href])=><div key={h} style={{background:'var(--paper-1)',border:'1px solid var(--line-light)',borderRadius:'var(--radius-card)',padding:28,display:'flex',flexDirection:'column',gap:12}}>
        <h3 style={{margin:0,fontSize:'var(--text-h3)',fontWeight:600}}>{h}</h3>
        <p style={{margin:0,fontSize:15,lineHeight:1.5,color:'var(--text-muted)',flex:1}}>{p}</p>
        <div>{href==='pip'?<CopyPromptButton label={cta} prompt="pip install mloda" popup="pip install mloda" hint="Click to copy the install command."/>:href==='agent'?<CopyPromptButton label={cta} prompt={AGENT_PROMPT} popup="Add mloda to your project"/>:<Button label={cta} variant="ink" size="sm" href={href||undefined}/>}</div>
      </div>)}
    </div>
  </section>;
}
function GradientCTA(){
  return <section style={{position:'relative',overflow:'hidden',padding:'120px 24px',textAlign:'center',color:'#fff',background:'var(--gradient-brand)'}}>
    <svg style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:.3,mixBlendMode:'overlay'}}><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
    <div style={{position:'relative'}}>
      <img src={A+'mloda-wordmark.svg'} alt="mloda" style={{height:72,filter:'brightness(0) invert(1)'}}/>
      <h2 style={{margin:'30px 0 0',fontSize:'clamp(30px,3.4vw,44px)',fontWeight:600,letterSpacing:'var(--tracking-display)'}}>Start building with us today.</h2>
      <div style={{display:'flex',gap:12,justifyContent:'center',marginTop:34}}>
        <Button label="Talk to us" variant="white" href="https://calendly.com/hello-mloda/30min"/>
        <Button label="Explore the open source" variant="ink" href={DOCS}/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,minmax(220px,300px))',gap:16,justifyContent:'center',marginTop:72}}>
        {[['Open source','Free to use. The library, all steps that ship with it, and the sets built on it. Apache-2.0.','Read the docs',DOCS],
          ['Custom','We build and support your steps and connections, and set up who may run which step and what ran. Contact us.','Talk to us','https://calendly.com/hello-mloda/30min']].map(([h,p,cta,href])=>
        <div key={h} style={{background:'rgba(255,255,255,.10)',border:'1px solid rgba(255,255,255,.28)',borderRadius:'var(--radius-card)',padding:'24px 22px',display:'flex',flexDirection:'column',gap:10,textAlign:'left',backdropFilter:'blur(4px)'}}>
          <h3 style={{margin:0,fontSize:19,fontWeight:600}}>{h}</h3>
          <p style={{margin:0,fontSize:13.5,lineHeight:1.5,color:'rgba(255,255,255,.8)',flex:1}}>{p}</p>
          {href?<div><Button label={cta} variant="white" size="sm" href={href}/></div>
            :<div style={{fontFamily:'var(--font-mono)',fontSize:12,letterSpacing:'0.06em',textTransform:'uppercase',color:'rgba(255,255,255,.75)',padding:'8px 0'}}>{cta}</div>}
        </div>)}
      </div>
    </div>
  </section>;
}
function App(){
  const [t,setTweak]=useTweaks(TWEAK_DEFAULTS);
  const [g1,g2,g3]=t.accent;
  const dark=t.theme==='dark';
  const vars={
    '--accent':g1,'--green-600':g1,'--green-700':g2,'--duotone-lo':g1,
    '--gradient-brand':`linear-gradient(160deg,${g2} 0%,${g1} 55%,${g3} 100%)`,
    ...(dark?{'--paper-0':'#0A0F0B','--paper-1':'#0F1611','--paper-2':'#18201A',
      '--text-ink':'#F4F7F4','--text-ink-2':'rgba(244,247,244,.64)','--line-light':'rgba(255,255,255,.14)',
      '--shadow-panel':'0 24px 60px rgba(0,0,0,.6)'}:{}),
    background:'var(--paper-0)',color:'var(--text-ink)',
    '--font-sans':`'${t.font}',Helvetica,Arial,sans-serif`,fontFamily:'var(--font-sans)'};
  const motion={calm:{slide:7000,wall:55},regular:{slide:2800,wall:30},energetic:{slide:2100,wall:14}}[t.motion];
  return <div style={vars}>
  <a href="https://github.com/mloda-ai/mloda" target="_blank" style={{display:'block',background:'var(--accent)',color:'#fff',textAlign:'center',padding:'5px 12px',fontSize:13,fontFamily:'var(--font-mono)',textDecoration:'none'}}>mloda 0.10.0 is out. Free and open source under Apache-2.0 →</a>
  <Navbar logoSrc={A+'mloda-wordmark-green.svg'} items={['How it works','Use cases','Docs','GitHub']} cta="Free on GitHub" ctaHref="https://github.com/mloda-ai/mloda"/>
  <Hero/>
  <ProductPanel interval={motion.slide} bright={t.panel==='bright'}/>
  <DataSources logoWall={<LogoWall names={['CSV','JSON','Parquet','Feather','ORC','Plain text','Markdown','YAML','SQLite','API / runtime data']} speed={motion.wall}/>}/>
  <Plugins/>
  <Trusted bright={t.panel==='bright'}/>
  <UseCases/>
  <GetStarted/>
  <GradientCTA/>
  <Footer logoSrc={A+'mloda-wordmark.svg'} columns={{Product:[['How it works','#how-it-works'],['Demo','#lineage'],['Built on mloda','#built-with-mloda'],['Use cases','#use-cases']],Developers:[['Docs',DOCS],['Quickstart',copyAgentPrompt],['GitHub','https://github.com/mloda-ai/mloda'],['PyPI','https://pypi.org/project/mloda/']],Company:['About','Blog','Contact'],Legal:['Imprint','Privacy Policy','Terms']}}/>
  <TweaksPanel>
    <TweakSection label="Brand"/>
    <TweakColor label="Accent" value={t.accent}
      options={[["#23A455","#12813C","#4FC578"],["#00A876","#007A55","#3BC493"],["#43B02A","#2E8A1D","#7BCB55"],["#E79460","#C96F35","#FAD689"]]}
      onChange={v=>setTweak('accent',v)}/>
    <TweakRadio label="Theme" value={t.theme} options={['light','dark']} onChange={v=>setTweak('theme',v)}/>
    <TweakRadio label="Panels" value={t.panel} options={['dark','bright']} onChange={v=>setTweak('panel',v)}/>
    <TweakSection label="Type"/>
    <TweakRadio label="Typeface" value={t.font} options={['Space Grotesk','Sora','Schibsted Grotesk','Bricolage Grotesque']} onChange={v=>setTweak('font',v)}/>
    <TweakSection label="Motion"/>
    <TweakRadio label="Energy" value={t.motion} options={['calm','regular','energetic']} onChange={v=>setTweak('motion',v)}/>
  </TweaksPanel>
</div>;
}
const copyAgentPrompt=()=>{copyToClipboard(AGENT_PROMPT);
  const t=document.createElement('div');t.textContent='Prompt copied! Paste it into your coding agent.';t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:999;background:var(--paper-0);color:var(--accent);border:1px solid var(--line-light);box-shadow:0 12px 32px rgba(14,18,15,.18);border-radius:999px;padding:10px 20px;font:600 13.5px Helvetica,Arial,sans-serif;opacity:0;transition:opacity 250ms';document.body.appendChild(t);requestAnimationFrame(()=>t.style.opacity='1');setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2200)};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
});
</script></body></html>
