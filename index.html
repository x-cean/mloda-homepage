function Slideshow({interval=2200}){
  const imgs=['mloda-screenshot-1.png','mloda-screenshot-2.png','mloda-screenshot-3.png'];
  const [i,setI]=React.useState(0);
  React.useEffect(()=>{if(!interval)return;const t=setInterval(()=>setI(v=>(v+1)%imgs.length),interval);return ()=>clearInterval(t)},[interval]);
  return <div style={{position:'relative'}}>
    <div style={{position:'relative',width:'100%',aspectRatio:'16/9',borderRadius:16,border:'1px solid var(--line-light)',background:'#fff',overflow:'hidden'}}>
      {imgs.map((f,n)=><img key={f} src={A+'images/'+f} alt={'mloda step '+(n+1)}
        style={{position:'absolute',inset:0,left:14,width:'calc(100% - 14px)',height:'100%',objectFit:'contain',
          opacity:n===i?1:0,transform:n===i?'translateX(0)':(n<i?'translateX(-24px)':'translateX(24px)'),
          transition:'opacity 400ms var(--ease-brand), transform 400ms var(--ease-brand)'}}/>)}
    </div>
    <div style={{display:'flex',gap:8,justifyContent:'center',marginTop:14}}>
      {imgs.map((f,n)=><button key={f} onClick={()=>setI(n)} aria-label={'Slide '+(n+1)}

    <text x="148" y="58" fontFamily={mono} fontSize="12" fill="var(--text-on-dark-2)">request = [</text>

function DataSources({logoWall}){
  const srcs=[['Databases','Postgres, MySQL, Snowflake - query in place, no copies.'],['Files & object stores','CSV, Parquet, S3 buckets - local or cloud.'],['APIs','REST and internal services, wrapped once as a FeatureGroup.'],['Feature outputs','Results of other features - chain and reuse across teams.']];

  const [hov,setHov]=React.useState(null);
  const [opsOpen,setOpsOpen]=React.useState(false);
  const [agentOpen,setAgentOpen]=React.useState(false);
  const [copied,setCopied]=React.useState(false);
  const [ghOpen,setGhOpen]=React.useState(false);
  const curve=i=>{const ys=[10,32,68,90];return `M 0 ${ys[i]} C 60 ${ys[i]}, 90 50, 160 50`};

    <SectionHeader title="Multi-model data sources" align="center"/>
    <div style={{display:'grid',gridTemplateColumns:'minmax(240px,300px) minmax(320px,1fr) minmax(240px,300px)',gap:0,alignItems:'center',marginTop:20}}>
      <div style={{display:'flex',flexDirection:'column',gap:14}}>
        {srcs.map(([h,p],i)=><div key={h} onMouseEnter={()=>setHov(i)} onMouseLeave={()=>setHov(null)}
          style={{position:'relative',background:'var(--paper-0)',border:hov===i?'1px solid var(--accent)':'1px solid var(--text-ink)',borderRadius:'var(--radius-card)',padding:'16px 20px',cursor:'default',transition:'all 250ms var(--ease-brand)',boxShadow:hov===i?'0 8px 24px rgba(14,18,15,.10)':'none'}}>
          <h3 style={{margin:0,fontSize:16,fontWeight:600,color:hov===i?'var(--accent)':'var(--text-ink)',transition:'color 250ms var(--ease-brand)'}}>{h}</h3>
          <div style={{maxHeight:hov===i?60:0,opacity:hov===i?1:0,overflow:'hidden',transition:'all 300ms var(--ease-brand)'}}>
            <p style={{margin:'6px 0 0',fontSize:13.5,lineHeight:1.45,color:'var(--text-muted)'}}>{p}</p>
          </div>
        </div>)}
      </div>
      <div style={{position:'relative',alignSelf:'stretch',minHeight:340,minWidth:0,display:'flex',alignItems:'center',justifyContent:'center',gap:14,padding:'0 8px'}}>
        <svg viewBox="0 0 560 100" preserveAspectRatio="none" style={{position:'absolute',inset:0,width:'100%',height:'100%',zIndex:0}}>
          {srcs.map((s,i)=><path key={i} d={curve(i)} fill="none" stroke={hov===i?'var(--accent)':'rgba(15,23,32,.24)'} strokeWidth={hov===i?1.6:1.2} strokeDasharray="4 5" style={{transition:'stroke 250ms'}} vectorEffect="non-scaling-stroke"/>)}
          <line x1="200" y1="50" x2="560" y2="50" stroke="rgba(15,23,32,.24)" strokeWidth="1.2" strokeDasharray="4 5" vectorEffect="non-scaling-stroke"/>
        </svg>
        <a href="https://github.com/mloda-ai/mloda" target="_blank" onMouseEnter={()=>setGhOpen(true)} onMouseLeave={()=>setGhOpen(false)} style={{position:'relative',zIndex:1,marginLeft:'auto',transform:'translateX(28px)',background:'var(--accent)',color:'#fff',borderRadius:14,padding:'16px 30px',fontFamily:'Helvetica,Arial,sans-serif',fontWeight:600,fontSize:24,textDecoration:'none',cursor:'pointer'}}>mloda
          <div style={{position:'absolute',left:'50%',bottom:76,transform:'translateX(-50%) '+(ghOpen?'translateY(0)':'translateY(6px)'),opacity:ghOpen?1:0,pointerEvents:'none',transition:'all 250ms var(--ease-brand)',background:'var(--paper-0)',border:'1px solid var(--line-light)',boxShadow:'0 12px 32px rgba(14,18,15,.14)',borderRadius:12,padding:'8px 12px',whiteSpace:'nowrap',fontSize:13,fontWeight:600,color:'var(--accent)'}}>Visit us on GitHub →</div>
        </a>
        <div onMouseEnter={()=>setOpsOpen(true)} onMouseLeave={()=>setOpsOpen(false)}
          style={{position:'relative',zIndex:1,cursor:'default',flexShrink:0,transform:'translateX(28px)'}}>
          <div style={{width:44,height:44,borderRadius:'50%',border:'1.5px dashed '+(opsOpen?'var(--accent)':'rgba(14,18,15,.35)'),background:'var(--paper-0)',display:'grid',placeItems:'center',fontSize:22,fontWeight:500,color:opsOpen?'var(--accent)':'var(--text-muted)',transition:'all 250ms var(--ease-brand)'}}>+</div>
          <div style={{position:'absolute',left:'50%',bottom:68,transform:'translateX(-50%) '+(opsOpen?'translateY(0)':'translateY(6px)'),opacity:opsOpen?1:0,pointerEvents:'none',transition:'all 250ms var(--ease-brand)',background:'var(--paper-0)',border:'1px solid var(--line-light)',boxShadow:'0 12px 32px rgba(14,18,15,.14)',borderRadius:12,padding:'10px 16px 8px',width:150}}>
            <div style={{fontFamily:'var(--font-mono)',fontSize:10,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:6}}>Optional data operations</div>
            {ops.map(o=><div key={o} style={{fontFamily:'var(--font-mono)',fontSize:12.5,color:o==='and more'?'var(--text-muted)':'var(--accent)',lineHeight:1.55}}>{o}</div>)}
          </div>
        </div>
        <div onMouseEnter={()=>setAgentOpen(true)} onMouseLeave={()=>{setAgentOpen(false);setCopied(false)}}
          onClick={()=>{const txt='Wire mloda into this project: pip install mloda, then wrap my existing data sources (databases, files, APIs) as FeatureGroups and replace ad-hoc data-fetching code with declarative mlodaAPI.run() feature requests. Docs: https://github.com/mloda-ai/mloda';
            const fallback=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');setCopied(true)}catch(e){}document.body.removeChild(ta)};
            if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>setCopied(true)).catch(fallback)}else{fallback()}}}
          style={{position:'relative',zIndex:1,flexShrink:0,marginTop:-7,marginLeft:'auto',marginRight:8,cursor:'pointer'}}>

            <path d="M16 28 q6 5 12 0" fill="none" stroke="var(--accent)" strokeWidth="2" strokeLinecap="round"/>
          </svg>
          <div style={{position:'absolute',left:'50%',bottom:64,transform:'translateX(-50%) '+(agentOpen?'translateY(0)':'translateY(6px)'),opacity:agentOpen?1:0,pointerEvents:'none',transition:'all 250ms var(--ease-brand)',background:'var(--paper-0)',border:'1px solid var(--line-light)',boxShadow:'0 12px 32px rgba(14,18,15,.14)',borderRadius:12,padding:'10px 12px',width:130,textAlign:'center'}}>
            <div style={{fontSize:13.5,fontWeight:600,color:'var(--accent)'}}>{copied?'Copied!':'Wire in mloda!'}</div>
            <div style={{fontFamily:'var(--font-mono)',fontSize:10.5,color:'var(--text-muted)',marginTop:4,lineHeight:1.45}}>{copied?'Paste it into your coding agent.':'Click to copy a prompt for your coding agent.'}</div>
          </div>
        </div>
      </div>
      <div style={{background:'var(--ink-900)',borderRadius:'var(--radius-card)',padding:'22px 24px',color:'var(--text-on-dark)'}}>
        <h3 style={{margin:0,fontSize:16,fontWeight:600}}>Your AI agent</h3>
        <p style={{margin:'6px 0 0',fontSize:13.5,lineHeight:1.5,color:'var(--text-on-dark-2)'}}>Receives exactly the data it asked for - resolved, processed, and traced to source.</p>
      </div>
    </div>
    {logoWall&&<div style={{marginTop:0}}>{logoWall}</div>}
  </section>;
}
function HowItWorks(){
  const steps=[['1','Connect what you already have','Wrap your DB, API, or files in a FeatureGroup - a small plugin, not a rewrite. Set it up once, reuse it everywhere.','connect'],
    ['2','Let your agent ask','Agents declare features by name - no pipeline code, no glue. Need processing? Add a suffix: __scored, __aggregated, and more.','declare'],
    ['3','Get data, fully traced','mloda resolves the dependency chain on your compute engine and returns results with lineage built in.','resolve']];
  return <section id="how-it-works" style={{padding:'36px 24px 80px',maxWidth:1200,margin:'0 auto'}}>
    <SectionHeader title="How it works" lede="Three steps from your existing stack to traceable, self-serve data access." align="center"/>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:20,marginTop:48}}>
      {steps.map(([n,h,p,g])=><div key={n} style={{background:'var(--paper-1)',border:'1px solid var(--line-light)',borderRadius:'var(--radius-card)',overflow:'hidden',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'18px 18px 0'}}><StepGraphic kind={g}/></div>
        <div style={{padding:24,display:'flex',flexDirection:'column',gap:8}}>
          <div style={{display:'flex',gap:10,alignItems:'baseline'}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:13,color:'var(--accent)',fontWeight:500}}>{n}</span>
            <h3 style={{margin:0,fontSize:20,fontWeight:600}}>{h}</h3>
          </div>
          <p style={{margin:0,fontSize:15,lineHeight:1.5,color:'var(--text-muted)'}}>{p}</p>
        </div>
      </div>)}
    </div>
  </section>;
}
function UseCaseCard({repo,eyebrow,title,desc,art,style}){
  const url='https://github.com/mloda-ai/'+repo;
  const [copied,setCopied]=React.useState(false);
  const [shareHov,setShareHov]=React.useState(false);
  const share=()=>{const fb=()=>{const ta=document.createElement('textarea');ta.value=url;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');setCopied(true)}catch(e){}document.body.removeChild(ta)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(()=>setCopied(true)).catch(fb)}else{fb()}
    setTimeout(()=>setCopied(false),2000)};
  return <div style={{display:'flex',flexDirection:'column',borderRadius:'var(--radius-panel)',overflow:'hidden',background:'var(--ink-900)',color:'var(--text-on-dark)',...style}}>
    <a href={url} target="_blank" style={{display:'block',height:150,background:'var(--ink-850)',borderBottom:'1px solid var(--line-dark)',cursor:'pointer'}}>{art}</a>
    <div style={{padding:'22px 26px 24px',display:'flex',flexDirection:'column',gap:10,flex:1}}>
      <div style={{fontFamily:'var(--font-mono)',fontSize:11,letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--text-on-dark-2)'}}>{eyebrow}</div>
      <h3 style={{margin:0,fontSize:21,fontWeight:600,lineHeight:1.25}}>{title}</h3>
      <p style={{margin:0,fontSize:14,lineHeight:1.55,color:'var(--text-on-dark-2)',flex:1}}>{desc}</p>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:8}}>
        <a href={url} target="_blank" style={{fontSize:14,fontWeight:600,color:'#fff'}}>Access case →</a>
        <span onClick={share} onMouseEnter={()=>setShareHov(true)} onMouseLeave={()=>setShareHov(false)} style={{fontSize:13,color:shareHov?'var(--ink-900)':'#fff',background:shareHov?'#fff':'transparent',border:'1px solid rgba(255,255,255,.45)',borderRadius:999,padding:'6px 14px',cursor:'pointer',transition:'all 180ms var(--ease-brand)'}}>{copied?'Link copied!':'Share case'}</span>
      </div>
    </div>
  </div>;
}

function CopyPromptButton({label,prompt,popup,hint}){
  const [open,setOpen]=React.useState(false);
  const [copied,setCopied]=React.useState(false);
  const copy=()=>{const fb=()=>{const ta=document.createElement('textarea');ta.value=prompt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');setCopied(true)}catch(e){}document.body.removeChild(ta)};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(prompt).then(()=>setCopied(true)).catch(fb)}else{fb()}};
  return <div onMouseEnter={()=>setOpen(true)} onMouseLeave={()=>{setOpen(false);setCopied(false)}} style={{position:'relative',display:'inline-block'}}>
    <Button label={label} variant="ink" size="sm" onClick={copy}/>
    <div style={{position:'absolute',left:'50%',bottom:'calc(100% + 10px)',transform:'translateX(-50%) '+(open?'translateY(0)':'translateY(6px)'),opacity:open?1:0,pointerEvents:'none',transition:'all 250ms var(--ease-brand)',background:'var(--paper-0)',border:'1px solid var(--line-light)',boxShadow:'0 12px 32px rgba(14,18,15,.14)',borderRadius:12,padding:'10px 12px',width:150,textAlign:'center',zIndex:5}}>
      <div style={{fontSize:13.5,fontWeight:600,color:'var(--accent)'}}>{copied?'Copied!':popup}</div>
      <div style={{fontFamily:'var(--font-mono)',fontSize:10.5,color:'var(--text-muted)',marginTop:4,lineHeight:1.45}}>{copied?'Paste it into your coding agent.':hint||'Click to copy a prompt for your coding agent.'}</div>
    </div>
  </div>;
}

const copyAgentPrompt=()=>{const txt='Wire mloda into this project: pip install mloda, then wrap my existing data sources (databases, files, APIs) as FeatureGroups and replace ad-hoc data-fetching code with declarative mlodaAPI.run() feature requests. Docs: https://github.com/mloda-ai/mloda';const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(e){}document.body.removeChild(ta)};if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).catch(fb)}else{fb()}
  const t=document.createElement('div');t.textContent='Prompt copied! Paste it into your coding agent.';t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:999;background:var(--paper-0);color:var(--accent);border:1px solid var(--line-light);box-shadow:0 12px 32px rgba(14,18,15,.18);border-radius:999px;padding:10px 20px;font:600 13.5px Helvetica,Arial,sans-serif;opacity:0;transition:opacity 250ms';document.body.appendChild(t);requestAnimationFrame(()=>t.style.opacity='1');setTimeout(()=>{t.style.opacity='0';setTimeout(()=>t.remove(),300)},2200)};
